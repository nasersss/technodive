name: Deploy production

# Every push / merge into main deploys to production (Hostinger).
# Secrets live in the GitHub environment "production"; add "Required reviewers"
# there to make each deployment wait for your approval.
# Can also be started by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at once; a newer one waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          coverage: none

      - name: Validate composer files
        run: composer validate --no-check-publish --no-check-all

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find app config database routes resources/lang lang -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Boot app and compile caches (views, routes, config)
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan view:cache
          php artisan route:cache
          php artisan config:cache

  deploy:
    name: Deploy to production
    needs: checks
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in SSH_HOST SSH_PORT SSH_USER DEPLOY_PATH SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set; trusting the host key found now (ssh-keyscan)."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy script on the server
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_BRANCH='main' DEPLOY_SHA='${{ github.sha }}' PHP_BIN='${{ vars.PHP_BIN || 'php' }}' COMPOSER_BIN='${{ vars.COMPOSER_BIN || 'composer' }}' bash -s" \
            < scripts/deploy.sh

      - name: Smoke test
        if: ${{ vars.SITE_URL != '' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L "${{ vars.SITE_URL }}")
          echo "Home page returned HTTP $code"
          [ "$code" = "200" ]

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
